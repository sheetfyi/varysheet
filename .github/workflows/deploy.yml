# Varysheet 持续集成 + 自动部署
#
# 触发方式
#   - push 到 main      -> 校验 -> 端到端冒烟测试 -> 自动部署到 Cloudflare Workers -> 线上冒烟测试
#                          全自动，不需要在网页上点「Run workflow」或确认任何选项：
#                          线上地址会写进 Step Summary，并作为一条 commit status
#                          （`deploy/cloudflare-workers`）挂到这次提交上
#   - pull_request      -> 只做校验与冒烟测试（绝不部署）
#   - workflow_dispatch -> 可选的手动重跑（想跳过远程 D1 迁移 / 跳过线上冒烟时才用）
#
# 需要的仓库 Secrets（Settings -> Secrets and variables -> Actions -> New repository secret）
#   CLOUDFLARE_API_TOKEN   必需。Cloudflare API 令牌
#   CLOUDFLARE_ACCOUNT_ID  必需。Cloudflare 账户 ID
#   D1_DATABASE_ID         可选。用户库（DB）的 database_id
#   D1_TABLES_TRIAL_ID     可选。试用表格分片库（DB_TABLES_TRIAL）的 database_id
#   D1_TABLES_BASIC_ID     可选。基础表格分片库（DB_TABLES_BASIC）的 database_id
#   D1_TABLES_PRO_ID       可选。专业表格分片库（DB_TABLES_PRO）的 database_id
#                          四个都不填也能部署：部署步骤会用 `node scripts/sync-d1-ids.mjs --create`
#                          按库名在本账户里查、查不到就现建一个（需要 Account > D1 > Edit）
#   RESEND_API_KEY         可选。Resend 发信密钥（注册确认码 / 重置密码通知邮件）
#   RESEND_FROM_EMAIL      可选。发件人，默认 Varysheet <admin@varysheet.com>
#   ADMIN_EMAIL            可选。超级管理员邮箱，登录时自动创建 / 提升该账号
#   ADMIN_PASSWORD         可选。管理员首次创建时用的密码（8 位以上，含字母与数字）
#
# 「可选」的 4 个会在部署成功后由 `wrangler secret put` 写进 Worker（未配置就跳过）；
# e2e job 里跑的本地库另用一个用完即弃的测试管理员（.dev.vars，见下方步骤）。
#
# 未配置 CLOUDFLARE_* 时部署步骤会被安全跳过（只跑校验），不会让流水线变红。
# 详细配置步骤见 DEPLOY.md「GitHub Actions 自动部署」。
name: Deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      skip_migrations:
        description: 跳过远程 D1 迁移，只重新部署代码
        type: boolean
        default: false
      skip_online_smoke:
        description: 跳过部署后的线上冒烟测试
        type: boolean
        default: false

permissions:
  contents: read
  # 部署完成后把线上地址写成一条 commit status（`deploy/cloudflare-workers`）：
  # 不用开网页翻日志，终端 / 提交页上就能看到这次提交部署到哪个地址
  statuses: write

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_VERSION: '22'
  WRANGLER_SEND_METRICS: 'false'

jobs:
  verify:
    name: 校验与构建
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 类型检查（客户端 + Worker）
        run: npm run typecheck

      - name: 路由自检
        run: npm run check:routes

      - name: 脚本语法自检（迁移 / 分片 / 同步 id）
        run: npm run check:scripts

      - name: 校验分片建表脚本与迁移文件是否同步
        run: npm run schema:check

      - name: 构建前端
        run: npm run build:client

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          if-no-files-found: error
          retention-days: 3

  e2e:
    name: 端到端冒烟测试
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: verify
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 构建前端（wrangler 的 assets 目录 ./dist 必须先存在）
        run: npm run build:client

      - name: 迁移本地 D1
        run: npm run db:migrate:local

      - name: 写入本地测试用 .dev.vars（临时库的管理员账号 + 确认码回显白名单）
        run: |
          cat > .dev.vars <<'EOF'
          # 只作用于 CI 里这个用完即弃的本地 D1；线上凭据一律走 wrangler secret
          ADMIN_EMAIL=admin@example.com
          ADMIN_PASSWORD=Smoke1admin
          AUTH_ECHO_CODE_DOMAINS=example.com,example.org,example.net
          EOF

      - name: 启动本地 Worker（--local，无需登录）
        run: |
          set -euo pipefail
          nohup npx wrangler dev --port 8787 --ip 127.0.0.1 --local --log-level info > /tmp/dev.log 2>&1 &
          echo $! > /tmp/dev.pid
          for i in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:8787/api/health >/dev/null 2>&1; then
              echo "Worker 已就绪（第 ${i} 次探测，累计 $((i * 2)) 秒）"
              exit 0
            fi
            sleep 2
          done
          echo "::error title=本地 Worker 启动超时::最后 60 行日志如下"
          tail -n 60 /tmp/dev.log || true
          exit 1

      - name: 运行冒烟测试
        run: |
          set -o pipefail
          node scripts/smoke-test.mjs 2>&1 | tee /tmp/smoke.log

      - name: 写入冒烟测试摘要
        if: always()
        run: |
          count="$(grep -Eo '[0-9]+/[0-9]+ checks passed' /tmp/smoke.log | tail -n 1 || true)"
          {
            echo "### 端到端冒烟测试（本地 Worker）"
            echo ""
            echo "- 断言结果：${count:-未生成结果（见上方日志）}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 打印 Worker 日志（失败时）
        if: failure()
        run: cat /tmp/dev.log || true

      - name: 停止本地 Worker
        if: always()
        run: kill "$(cat /tmp/dev.pid)" 2>/dev/null || true

  deploy:
    name: 部署到 Cloudflare Workers
    if: github.event_name != 'pull_request'
    needs: [verify, e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 检查部署凭据
        id: creds
        run: |
          set -euo pipefail
          missing=()
          [ -n "${CLOUDFLARE_API_TOKEN:-}" ] || missing+=(CLOUDFLARE_API_TOKEN)
          [ -n "${CLOUDFLARE_ACCOUNT_ID:-}" ] || missing+=(CLOUDFLARE_ACCOUNT_ID)
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=已跳过部署::仓库缺少 Secrets：${missing[*]}，配置方法见 DEPLOY.md"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      # 存储拆分之后表格数据在独立的分片库里（见 docs/storage.md）：用户库之外的三个主分片
      # 也必须有本账户下的真实 database_id，否则 `wrangler deploy` 会因为绑定指向不存在的库
      # 而失败（错误码 10181）。database_id 会随账户变（库名才是不变的身份），所以这里：
      #   1. 仓库 Secret 提供了 id 就用 Secret（D1_DATABASE_ID / D1_TABLES_*_ID）
      #   2. 没提供就按库名在本账户里查（换账户 / 重建库后自动对上）
      #   3. 本账户里查不到就 `wrangler d1 create` 现建一个（幂等，重跑安全）
      - name: 同步 D1 数据库 ID（用户库 + 三个分片库）
        if: steps.creds.outputs.ready == 'true'
        env:
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
          D1_TABLES_TRIAL_ID: ${{ secrets.D1_TABLES_TRIAL_ID }}
          D1_TABLES_BASIC_ID: ${{ secrets.D1_TABLES_BASIC_ID }}
          D1_TABLES_PRO_ID: ${{ secrets.D1_TABLES_PRO_ID }}
        run: |
          set -euo pipefail
          if ! node scripts/sync-d1-ids.mjs --create 2>&1 | tee /tmp/d1-ids.log; then
            if grep -qE '10000|Authentication error|9109|Unauthorized' /tmp/d1-ids.log; then
              echo "::error title=D1 权限不足::CLOUDFLARE_API_TOKEN 缺少 Account > D1 > Edit（缺它连 npx wrangler d1 list 都会 401），见 DEPLOY.md 6.1"
            else
              echo "::error title=D1 配置失败::详见上方日志；本账户里没有同名库时脚本会尝试现建（见 DEPLOY.md 6.2）"
            fi
            exit 1
          fi

      - name: 确保 R2 存储桶存在
        if: steps.creds.outputs.ready == 'true'
        run: |
          if npx wrangler r2 bucket create cloudnotion-files 2>&1 | tee /tmp/r2.log; then
            echo "R2 桶 cloudnotion-files 已就绪"
            exit 0
          fi
          if grep -qi 'already exists' /tmp/r2.log; then
            echo "R2 桶 cloudnotion-files 已存在，跳过创建"
            exit 0
          fi
          if grep -q '10042' /tmp/r2.log; then
            echo "::error title=R2 未开通::该账户还没启用 R2。请先在 Cloudflare 控制台 Storage & Databases -> R2 Object Storage 完成开通（需绑定付款方式），再给 API Token 补上 Account > Workers R2 Storage > Edit，然后重跑（见 DEPLOY.md 6.1）"
          elif grep -qE 'Authentication error|10000|9109|Unauthorized' /tmp/r2.log; then
            echo "::error title=R2 权限不足::当前 CLOUDFLARE_API_TOKEN 缺少 Account > Workers R2 Storage > Edit 权限（见 DEPLOY.md 6.1）"
          else
            echo "::error title=R2 桶创建失败::详见上方日志"
          fi
          exit 1

      # 两个迁移目录各自独立：migrations/control 作用于用户库（cloudnotion-db），
      # migrations/tables 作用于每个分片库（cloudnotion-tables-trial / -basic / -pro）。
      - name: 应用远程 D1 迁移
        if: steps.creds.outputs.ready == 'true' && inputs.skip_migrations != 'true'
        run: |
          set -o pipefail
          if npm run db:migrate:remote 2>&1 | tee /tmp/migrate.log; then
            exit 0
          fi
          if grep -qE 'Authentication error|10000|9109|Unauthorized|401|403' /tmp/migrate.log; then
            echo "::error title=D1 权限不足::当前 CLOUDFLARE_API_TOKEN 缺少 Account > D1 > Edit 权限，wrangler 连 D1 API 都会 401。请在 Cloudflare 控制台编辑该 Token 补上 D1 Edit 后重跑（见 DEPLOY.md 6.1）"
          elif grep -qE 'not found|does not exist|7500' /tmp/migrate.log; then
            echo "::error title=D1 数据库不存在::wrangler.jsonc 的 database_id（用户库 / 分片库）不是本账户下的真实 id，见 DEPLOY.md 6.2"
          else
            echo "::error title=D1 迁移失败::详见上方日志（用户库看 migrations/control，分片库看 migrations/tables）"
          fi
          exit 1

      - name: 构建前端
        if: steps.creds.outputs.ready == 'true'
        run: npm run build:client

      - name: 部署 Worker
        id: deploy
        if: steps.creds.outputs.ready == 'true'
        run: |
          set -euo pipefail
          # `--var BUILD_ID` 给这次部署打上批次号（= 本次 commit）：/api/health 的 build
          # 会返回它，下面的线上冒烟先等它生效再跑断言，避免撞上还在服务的上一版。
          if ! npx wrangler deploy --var BUILD_ID:"${GITHUB_SHA}" 2>&1 | tee /tmp/deploy.log; then
            if grep -q '10181' /tmp/deploy.log; then
              echo "::error title=D1 数据库不存在::wrangler.jsonc 的 database_id（或 Secrets.D1_DATABASE_ID）不属于本账户。先 npx wrangler d1 create cloudnotion-db 建库、把返回的 id 回填到 wrangler.jsonc（或存成 D1_DATABASE_ID Secret）后重跑，见 DEPLOY.md 6.2"
            elif grep -qE 'Authentication error|10000|9109|Unauthorized' /tmp/deploy.log; then
              echo "::error title=部署权限不足::当前 CLOUDFLARE_API_TOKEN 缺少 Account > Workers Scripts > Edit 权限（见 DEPLOY.md 6.1）"
            else
              echo "::error title=部署失败::详见上方日志"
            fi
            exit 1
          fi
          url="$(grep -Eo 'https://[a-zA-Z0-9._-]+\.workers\.dev' /tmp/deploy.log | tail -n 1 || true)"
          echo "url=${url}" >> "$GITHUB_OUTPUT"
          {
            echo "### Varysheet 部署完成 🚀"
            echo ""
            echo "- 线上地址：${url:-见本次运行日志}"
            echo "- Commit：\`${GITHUB_SHA:0:7}\`（部署批次 \`build=${GITHUB_SHA}\`，见 \`/api/health\`）"
            echo "- 冒烟测试（本地 e2e）：见上面 e2e job 的摘要"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 同步可选 Secrets（邮件 / 管理员 / 测试域回显白名单）到 Worker
        if: steps.creds.outputs.ready == 'true'
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM_EMAIL: ${{ secrets.RESEND_FROM_EMAIL }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          # 配了它（例如 `example.com,example.org,example.net`）时，这些保留测试域的收件人不真发信、
          # 直接把确认码回显在响应里：线上冒烟测试靠它走完两步注册。不配就跳过（此时只有「没配
          # RESEND_API_KEY」的情况下才会回显）。
          AUTH_ECHO_CODE_DOMAINS: ${{ secrets.AUTH_ECHO_CODE_DOMAINS }}
        run: |
          set -uo pipefail
          put() {
            local name="$1" value="${2:-}"
            if [ -z "$value" ]; then
              echo "- $name：仓库未配置该 Secret，跳过"
              return 0
            fi
            if printf '%s' "$value" | npx wrangler secret put "$name" >>/tmp/secrets.log 2>&1; then
              echo "- $name：已写入 Worker secret"
            else
              echo "::warning title=写入 Secret 失败::$name 未能写入（见上方日志；首次部署时 Worker 可能还不存在，重跑一次即可）"
              tail -n 20 /tmp/secrets.log || true
            fi
          }
          put RESEND_API_KEY "${RESEND_API_KEY:-}"
          put RESEND_FROM_EMAIL "${RESEND_FROM_EMAIL:-}"
          put ADMIN_EMAIL "${ADMIN_EMAIL:-}"
          put ADMIN_PASSWORD "${ADMIN_PASSWORD:-}"
          put AUTH_ECHO_CODE_DOMAINS "${AUTH_ECHO_CODE_DOMAINS:-}"
          {
            echo "### Worker 环境变量"
            echo ""
            echo "- 邮件发信：$([ -n "${RESEND_API_KEY:-}" ] && echo '已配置（真实发信）' || echo '未配置（确认码回显，仅适合测试）')"
            echo "- 超级管理员：$([ -n "${ADMIN_EMAIL:-}" ] && echo '已配置' || echo '未配置（用户管理页面无法访问）')"
            echo "- 测试域回显白名单：$([ -n "${AUTH_ECHO_CODE_DOMAINS:-}" ] && echo "已配置（${AUTH_ECHO_CODE_DOMAINS}）" || echo '未配置（只有没配 RESEND_API_KEY 时才回显确认码）')"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 线上冒烟测试（对部署后的真实地址跑完整断言）
        id: online_smoke
        if: steps.creds.outputs.ready == 'true' && inputs.skip_online_smoke != 'true'
        env:
          BASE_URL: ${{ steps.deploy.outputs.url }}
          # 与部署步骤 `wrangler deploy --var BUILD_ID=<sha>` 是同一个值：冒烟测试会断言
          # 目标跑的就是这次部署（见 /api/health 的 build 字段）
          SMOKE_EXPECT_BUILD: ${{ github.sha }}
          # 仓库配了管理员 Secrets 就用同一套账号验证线上「用户管理」（未配置时回落到冒烟测试默认值 → 该段自动 skip）
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL || 'admin@example.com' }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD || 'Smoke1admin' }}
        run: |
          set -euo pipefail
          if [ -z "${BASE_URL:-}" ]; then
            echo "::warning title=已跳过线上冒烟测试::未能从 wrangler deploy 输出里解析到 workers.dev 地址（使用自定义域名时属正常）"
            echo "- 线上冒烟测试：已跳过（未解析到 workers.dev 地址）" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "线上目标地址：${BASE_URL}"
          # `wrangler deploy` 返回时部署已经生效，但边缘上还在跑上一版的实例要几秒才换掉：
          # 先等这次部署的批次号（build）真正在服务，再跑断言。否则会撞上上一版——实测撞过
          # 一次：刚加的「购买时长白名单」断言被旧版本报成 201，看起来像代码写错了。
          build_ready=false
          live_build=''
          for i in $(seq 1 30); do
            live_build="$(curl -fsS "${BASE_URL}/api/health" | grep -Eo '"build":"[^"]*"' | head -n 1 | cut -d'"' -f4 || true)"
            if [ "${live_build}" = "${SMOKE_EXPECT_BUILD}" ]; then
              build_ready=true
              echo "新版本已在线上服务（第 ${i} 次探测，约 $((i * 3)) 秒）"
              break
            fi
            sleep 3
          done
          if [ "${build_ready}" = true ]; then
            echo "- 线上版本：\`build=${live_build}\`（等待传播约 $((i * 3)) 秒）" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::error title=新版本未传播到边缘::${BASE_URL} 报告的 build=${live_build:-（没有 build 字段）}，期望 ${SMOKE_EXPECT_BUILD}；下面的冒烟测试会因此报「the target runs the freshly deployed build」失败"
            echo "- 线上版本：新版本未传播（读到 \`build=${live_build:-无}\`，期望 \`${SMOKE_EXPECT_BUILD}\`）" >> "$GITHUB_STEP_SUMMARY"
          fi
          node scripts/smoke-test.mjs 2>&1 | tee /tmp/smoke-online.log
          count="$(grep -Eo '[0-9]+/[0-9]+ checks passed' /tmp/smoke-online.log | tail -n 1 || true)"
          echo "- 线上冒烟测试（${BASE_URL}）：${count:-已通过 ✅}" >> "$GITHUB_STEP_SUMMARY"

      # 失败时把冒烟日志里的失败行打到注解里：不登 GitHub 网页（或从 API 读 check-runs）也能定位，
      # 注释内容也会出现在 job 日志的末尾。
      - name: 线上冒烟失败时输出失败断言（排障用）
        if: failure() && steps.online_smoke.outcome == 'failure'
        run: |
          set -uo pipefail
          if [ -f /tmp/smoke-online.log ]; then
            echo "线上冒烟失败，最后 40 行："
            tail -n 40 /tmp/smoke-online.log || true
            first="$(grep -m1 -E 'FAIL' /tmp/smoke-online.log | tr -s ' ' | cut -c1-400 || true)"
            echo "::error title=线上冒烟失败::${first:-详见 job 日志里的 FAIL 行}"
          fi

      # 收尾：把这次的线上地址写成一条 commit status（`deploy/cloudflare-workers`）。
      # 好处是「push 完不用开网页」——终端里 `git log`、提交页、或
      # `curl -s https://api.github.com/repos/<owner>/<repo>/commits/<sha>/statuses`
      # 都能直接读到这次部署的地址与成败，不需要给任何人「点确认」。
      - name: 把线上地址写到提交状态
        if: always() && steps.creds.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_URL: ${{ steps.deploy.outputs.url }}
          DEPLOY_OUTCOME: ${{ steps.deploy.outcome }}
          SMOKE_OUTCOME: ${{ steps.online_smoke.outcome }}
        run: |
          set -uo pipefail
          if [ -z "${DEPLOY_URL:-}" ]; then
            echo "没有解析到 workers.dev 地址（用自定义域名时属正常），跳过提交状态"
            exit 0
          fi
          if [ "${DEPLOY_OUTCOME}" = "success" ] && { [ "${SMOKE_OUTCOME}" = "success" ] || [ "${SMOKE_OUTCOME}" = "skipped" ]; }; then
            state=success
            description="build ${GITHUB_SHA:0:7} 已部署"
          else
            state=failure
            # 把线上冒烟里第一条失败断言塞进提交状态（140 字符上限）：
            # 这样 `curl .../commits/<sha>/statuses` 或 `git log` 里就能直接看到失败原因
            first_fail=""
            if [ -f /tmp/smoke-online.log ]; then
              first_fail="$(grep -m1 -E 'FAIL' /tmp/smoke-online.log | tr -s ' ' | cut -c1-90 || true)"
            fi
            description="冒烟失败：${first_fail:-部署或线上冒烟测试未通过}"
            description="${description:0:140}"
          fi
          body="$(printf '{"state":"%s","context":"deploy/cloudflare-workers","description":"%s","target_url":"%s"}' \
            "$state" "$description" "$DEPLOY_URL")"
          if curl -fsS -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d "$body" > /dev/null; then
            echo "提交状态已更新（${state}）：${DEPLOY_URL}"
          else
            echo "::warning title=写入提交状态失败::不影响部署结果，线上地址见上面的日志与 Step Summary"
          fi
